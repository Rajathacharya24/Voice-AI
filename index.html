<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clinical Note — Live Speech to Text</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f4f7fb;
    color: #1e293b;
    padding: 24px;
  }
  .container { max-width: 820px; margin: 0 auto; }
  header {
    background: #0f4c81;
    color: #fff;
    padding: 20px 24px;
    border-radius: 12px 12px 0 0;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header p { font-size: 13px; opacity: .85; margin-top: 4px; }
  .card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-top: none;
    border-radius: 0 0 12px 12px;
    padding: 24px;
  }
  .recorder {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  #recordBtn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    background: #dc2626;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #recordBtn.recording { background: #991b1b; animation: pulse 1.2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(220,38,38,.5); }
    70% { box-shadow: 0 0 0 14px rgba(220,38,38,0); }
    100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
  }
  .rec-status { flex: 1; }
  .rec-status .state { font-weight: 600; font-size: 14px; }
  .rec-status .hint { font-size: 12px; color: #64748b; margin-top: 2px; }
  #timer { font-variant-numeric: tabular-nums; font-weight: 600; color: #dc2626; }
  #langSel {
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    background: #fff;
    color: #1e293b;
    max-width: 190px;
    flex-shrink: 0;
  }
  #live {
    font-size: 13px;
    color: #64748b;
    font-style: italic;
    min-height: 18px;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  label { font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: .03em; }
  #note {
    width: 100%;
    min-height: 460px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.6;
    resize: vertical;
    background: #fff;
  }
  #note:focus { outline: 2px solid #0f4c81; outline-offset: -1px; }
  #status { font-size: 13px; color: #0f4c81; min-height: 18px; margin: 8px 0; }
  #status.error { color: #dc2626; }
  .actions { display: flex; gap: 10px; }
  button.secondary {
    border: 1px solid #cbd5e1;
    background: #fff;
    color: #334155;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  button.secondary:hover { background: #f8fafc; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Clinical Note — Live Dictation (Telnyx · Deepgram Flux)</h1>
    <p>Press the mic and speak — text appears live in the note. Language is detected automatically.</p>
  </header>

  <div class="card">
    <div class="recorder">
      <button id="recordBtn" title="Start / stop live transcription">&#127908;</button>
      <div class="rec-status">
        <div class="state">Status: <span id="state">Idle</span> <span id="timer"></span></div>
        <div class="hint">Say <b>"comma"</b>, <b>"full stop"</b>, <b>"next line"</b> — they become , . and line breaks.</div>
      </div>
      <select id="langSel" title="Dictation language (Deepgram flux supports these 10)">
        <option value="multi">🌐 Auto-detect</option>
        <option value="en">English</option>
        <option value="hi">हिन्दी — Hindi</option>
        <option value="es">Español — Spanish</option>
        <option value="fr">Français — French</option>
        <option value="de">Deutsch — German</option>
        <option value="pt">Português — Portuguese</option>
        <option value="it">Italiano — Italian</option>
        <option value="nl">Nederlands — Dutch</option>
        <option value="ru">Русский — Russian</option>
        <option value="ja">日本語 — Japanese</option>
      </select>
    </div>

    <div id="live"></div>
    <label for="note">Clinical Note</label>
    <textarea id="note" spellcheck="false"></textarea>

    <div id="status"></div>
    <div class="actions">
      <button class="secondary" id="clearBtn">Clear Note</button>
      <button class="secondary" id="downloadBtn">Download Note (.txt)</button>
    </div>
  </div>
</div>

<script>
const note = document.getElementById("note");
const liveEl = document.getElementById("live");
const statusEl = document.getElementById("status");
const stateEl = document.getElementById("state");
const timerEl = document.getElementById("timer");
const recordBtn = document.getElementById("recordBtn");

let ws = null;
let audioCtx = null;
let stream = null;
let processor = null;
let source = null;
let timerInt = null;
let seconds = 0;
let pendingFinal = false;
let lastLive = "";
let eotSeen = false;
let lastTurnIndex = -1;
let lastTurnAppended = false;

const langSel = document.getElementById("langSel");
langSel.value = localStorage.getItem("dictationLang") || "multi";
langSel.addEventListener("change", async () => {
  localStorage.setItem("dictationLang", langSel.value);
  if (ws) {
    stopRecording(true);
    await new Promise(r => setTimeout(r, 2200));
    setStatus("Language: " + langSel.options[langSel.selectedIndex].text);
    startRecording();
  }
});

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = isError ? "error" : "";
}

function formatDictation(text) {
  let t = " " + text.trim() + " ";
  t = t.replace(/\s*\b(?:next\s+line|new\s+line|newline)\b[,]?\s*/gi, "\n");
  t = t.replace(/\s*\bnew\s+paragraph\b[,]?\s*/gi, "\n\n");
  t = t.replace(/\s*\b(?:full\s*stop|fullstop|period)\b[,]?\s*/gi, ". ");
  t = t.replace(/\s*\bcomma\b[,]?\s*/gi, ", ");
  t = t.replace(/\s*\bquestion\s+mark\b[,]?\s*/gi, "? ");
  t = t.replace(/\s*\b(?:exclamation\s+mark|exclamation\s+point)\b[,]?\s*/gi, "! ");
  t = t.replace(/\s*\bcolon\b[,]?\s*/gi, ": ");
  t = t.replace(/\s*\bsemicolon\b[,]?\s*/gi, "; ");
  t = t.replace(/\s*\bhyphen\b[,]?\s*/gi, "-");
  t = t.replace(/\n[ \t]+/g, "\n");
  t = t.replace(/[ \t]+([.,;:!?])/g, "$1");
  t = t.replace(/[ \t]{2,}/g, " ");
  t = t.replace(/^[ \t]+|[ \t]+$/g, "");
  t = t.replace(/(^|[.!?]\s+|\n+)([a-z])/g, (m, p, c) => p + c.toUpperCase());
  return t;
}

function appendToNote(t) {
  const cur = note.value.replace(/[ \t]+$/, "");
  if (t.startsWith("\n")) {
    note.value = cur.replace(/\n+$/, "") + t;
  } else if (cur) {
    note.value = cur + (cur.endsWith("\n") ? "" : " ") + t;
  } else {
    note.value = t;
  }
}

recordBtn.addEventListener("click", () => {
  if (ws) stopRecording();
  else startRecording();
});

async function startRecording() {
  statusEl.textContent = "";
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });

    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/stt?lang=${encodeURIComponent(langSel.value)}`);
    ws.binaryType = "arraybuffer";

    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }

      if (msg.type === "ready") {
        eotSeen = false;
        lastTurnIndex = -1;
        lastTurnAppended = false;
        stateEl.textContent = "Listening…";
        recordBtn.classList.add("recording");
        recordBtn.textContent = "■";
        startAudio();
        seconds = 0;
        timerEl.textContent = " 0:00";
        timerInt = setInterval(() => {
          seconds++;
          timerEl.textContent = ` ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
        }, 1000);
        return;
      }

      if (msg.errors) {
        setStatus("Telnyx: " + (msg.errors[0]?.detail || "error"), true);
        return;
      }

      if (msg.event) {
        if (msg.event === "Update") {
          lastLive = msg.transcript || "";
          liveEl.textContent = lastLive;
        } else if (msg.event === "EndOfTurn") {
          eotSeen = true;
          // flux can fire EndOfTurn more than once for the same turn
          // (draft, then revision) — append each turn exactly once
          const sameTurn = msg.turn_index !== undefined && msg.turn_index === lastTurnIndex;
          if (sameTurn && lastTurnAppended) {
            lastLive = "";
            liveEl.textContent = "";
            return;
          }
          const raw = (msg.transcript && msg.transcript.trim()) ? msg.transcript : lastLive;
          const t = formatDictation(raw);
          lastTurnAppended = false;
          if (t.trim() && !note.value.trimEnd().toLowerCase().endsWith(t.trim().toLowerCase())) {
            appendToNote(t);
            pendingFinal = true;
            lastTurnAppended = true;
          }
          if (msg.turn_index !== undefined) lastTurnIndex = msg.turn_index;
          lastLive = "";
          liveEl.textContent = "";
        }
        return;
      }

      if (msg.transcript !== undefined) {
        if (msg.is_final) {
          if (msg.utterance_end) return;
          eotSeen = true;
          const t = formatDictation(msg.transcript);
          if (t.trim() && !note.value.trimEnd().toLowerCase().endsWith(t.trim().toLowerCase())) {
            appendToNote(t);
            pendingFinal = true;
          }
          lastLive = "";
          liveEl.textContent = "";
        } else {
          lastLive = msg.transcript;
          liveEl.textContent = formatDictation(msg.transcript);
        }
      }
    };

    ws.onclose = () => {
      if (stateEl.textContent !== "Idle") stopCleanup();
    };
    ws.onerror = () => setStatus("Connection error to transcription server.", true);
  } catch (err) {
    setStatus("Microphone access denied: " + err.message, true);
    stopCleanup();
  }
}

function startAudio() {
  audioCtx = new AudioContext();
  source = audioCtx.createMediaStreamSource(stream);
  processor = audioCtx.createScriptProcessor(4096, 1, 1);
  processor.onaudioprocess = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const pcm16 = floatTo16k(e.inputBuffer.getChannelData(0), audioCtx.sampleRate);
    ws.send(pcm16.buffer);
  };
  source.connect(processor);
  processor.connect(audioCtx.destination);
}

function floatTo16k(float32, inputRate) {
  const targetRate = 16000;
  const ratio = inputRate / targetRate;
  const outLen = Math.floor(float32.length / ratio);
  const out = new Int16Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const idx = Math.floor(i * ratio);
    let s = float32[idx] || 0;
    s = Math.max(-1, Math.min(1, s));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

let stopTimers = [];

function stopRecording(silent) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    if (processor) { processor.onaudioprocess = null; processor.disconnect(); processor = null; }
    if (source) { source.disconnect(); source = null; }

    const sil = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(new Int16Array(3200).buffer);
    }, 150);
    stopTimers.push(sil);

    stopTimers.push(setTimeout(() => {
      clearInterval(sil);
      if (!eotSeen && lastLive.trim()) {
        const t = formatDictation(lastLive);
        if (t.trim() && !note.value.trimEnd().toLowerCase().endsWith(t.trim().toLowerCase())) {
          appendToNote(t);
          pendingFinal = true;
        }
      }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "CloseStream" }));
      }
      stopTimers.push(setTimeout(() => stopCleanup(), 400));
    }, 3000));
  } else {
    stopCleanup();
  }
  if (!silent) setStatus(pendingFinal ? "Transcription saved to note." : "");
  pendingFinal = false;
}

function stopCleanup() {
  stopTimers.forEach(clearTimeout);
  stopTimers = [];
  stateEl.textContent = "Idle";
  timerEl.textContent = "";
  recordBtn.classList.remove("recording");
  recordBtn.innerHTML = "&#127908;";
  clearInterval(timerInt);
  liveEl.textContent = "";
  if (processor) { processor.onaudioprocess = null; processor.disconnect(); processor = null; }
  if (source) { source.disconnect(); source = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (ws) { ws.close(); ws = null; }
}

document.getElementById("clearBtn").addEventListener("click", () => {
  note.value = "";
  setStatus("Note cleared.");
});

document.getElementById("downloadBtn").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([note.value], { type: "text/plain" }));
  a.download = "clinical-note.txt";
  a.click();
});
</script>
</body>
</html>
